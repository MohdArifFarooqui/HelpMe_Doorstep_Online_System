<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HelpMe Doorstep - Customer Login</title>

   <style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        min-height: 100%;
    }

    body {
        min-height: 100vh;
        font-family:
            Arial,
            "Noto Sans Devanagari",
            sans-serif;

        background:
            linear-gradient(
                145deg,
                #eaf4ff 0%,
                #f7fbff 45%,
                #eef8f4 100%
            );

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 22px 14px;
    }


    /* ==============================
       LOGIN CARD
       ============================== */

    .login-card {
        width: 100%;
        max-width: 430px;

        background: rgba(255,255,255,0.97);

        border: 1px solid rgba(25,118,210,0.10);

        border-radius: 24px;

        padding: 30px 24px 22px;

        box-shadow:
            0 18px 50px rgba(20,70,110,0.14),
            0 4px 14px rgba(20,70,110,0.08);
    }


    /* ==============================
       LOGO
       ============================== */

    .brand-logo-wrap {
        width: 104px;
        height: 104px;

        margin: 0 auto 16px;

        padding: 7px;

        background: #ffffff;

        border-radius: 50%;

        display: flex;
        align-items: center;
        justify-content: center;

        box-shadow:
            0 8px 24px rgba(21,101,192,0.16);

        border: 1px solid #e4edf7;
    }

    .logo {
        width: 90px;
        height: 90px;

        object-fit: contain;

        display: block;

        border-radius: 50%;
    }


    /* ==============================
       TITLE
       ============================== */

    h1 {
        margin: 0;

        text-align: center;

        font-size: 27px;
        line-height: 1.25;

        font-weight: 800;

        color: #1565c0;

        letter-spacing: -0.3px;
    }


    .subtitle {
        text-align: center;

        margin-top: 7px;
        margin-bottom: 28px;

        font-size: 15px;

        color: #667085;

        font-weight: 600;
    }


    /* ==============================
       FORM LABEL
       ============================== */

    label {
        display: block;

        margin-bottom: 8px;

        font-size: 15px;

        font-weight: 700;

        color: #263238;
    }


    /* ==============================
       INPUT
       ============================== */

    input[type="tel"] {
        width: 100%;

        min-height: 54px;

        padding: 14px 16px;

        border: 1.5px solid #d5dee8;

        border-radius: 13px;

        background: #fbfdff;

        color: #17212b;

        font-size: 17px;

        outline: none;

        transition:
            border-color 0.2s ease,
            box-shadow 0.2s ease,
            background 0.2s ease;
    }

    input[type="tel"]::placeholder {
        color: #98a2b3;
    }

    input[type="tel"]:focus {
        border-color: #1976d2;

        background: #ffffff;

        box-shadow:
            0 0 0 4px rgba(25,118,210,0.10);
    }


    /* ==============================
       TERMS BOX
       ============================== */

    .login-card > div[style] {
        margin-top: 18px !important;

        padding: 14px !important;

        background: #f6f9fc !important;

        border: 1px solid #e5ebf2;

        border-radius: 13px !important;
    }

    .login-card > div[style] label {
        display: flex;

        align-items: flex-start;

        gap: 10px;

        margin: 0;

        font-size: 13.5px;

        line-height: 1.55;

        font-weight: 500;

        color: #475467;
    }

    .login-card > div[style] input[type="checkbox"] {
        flex: 0 0 auto;

        width: 20px !important;
        height: 20px !important;

        margin: 2px 0 0 !important;

        accent-color: #1976d2;
    }

    .login-card a {
        color: #1565c0;

        font-weight: 700;

        text-decoration: none;
    }

    .login-card a:hover {
        text-decoration: underline;
    }


    /* ==============================
       BUTTONS
       ============================== */

    button {
        width: 100%;

        min-height: 54px;

        margin-top: 16px;

        padding: 14px 18px;

        border: 0;

        border-radius: 13px;

        background:
            linear-gradient(
                135deg,
                #1976d2,
                #1565c0
            );

        color: #ffffff;

        font-size: 16px;

        font-weight: 800;

        letter-spacing: 0.1px;

        cursor: pointer;

        box-shadow:
            0 8px 18px rgba(25,118,210,0.22);

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            opacity 0.15s ease;
    }

    button:hover {
        transform: translateY(-1px);

        box-shadow:
            0 11px 24px rgba(25,118,210,0.28);
    }

    button:active {
        transform: translateY(0);
    }

    button:disabled {
        background: #aeb8c2;

        box-shadow: none;

        cursor: not-allowed;

        transform: none;

        opacity: 0.9;
    }


    /* ==============================
       OTP SECTION
       ============================== */

    #otp-box {
        display: none;

        margin-top: 22px;

        padding-top: 4px;
    }

    #otp-box label {
        margin-bottom: 8px;
    }


    /* ==============================
       OTP INPUT
       ============================== */

    #otp {
        width: 100%;

        min-height: 58px;

        text-align: center;

        letter-spacing: 7px;

        font-size: 22px;

        font-weight: 800;
    }


    /* ==============================
       MESSAGE
       ============================== */

    .message {
        margin-top: 18px;

        padding: 12px 14px;

        border-radius: 11px;

        text-align: center;

        font-size: 13.5px;

        line-height: 1.5;

        display: none;

        border: 1px solid transparent;
    }

    .message.success {
        display: block;

        background: #ecfdf3;

        color: #067647;

        border-color: #abefc6;
    }

    .message.error {
        display: block;

        background: #fef3f2;

        color: #b42318;

        border-color: #fecdca;
    }


    /* ==============================
       FOOTER
       ============================== */

    .footer {
        text-align: center;

        margin-top: 22px;

        padding-top: 15px;

        border-top: 1px solid #edf1f5;

        color: #98a2b3;

        font-size: 12px;
    }


    /* ==============================
       MOBILE
       ============================== */

    @media (max-width: 480px) {

        body {
            padding: 14px 10px;
        }

        .login-card {
            max-width: 100%;

            padding:
                26px
                18px
                20px;

            border-radius: 22px;
        }

        .brand-logo-wrap {
            width: 94px;
            height: 94px;

            margin-bottom: 14px;
        }

        .logo {
            width: 81px;
            height: 81px;
        }

        h1 {
            font-size: 24px;
        }

        .subtitle {
            font-size: 14px;

            margin-bottom: 24px;
        }

        label {
            font-size: 14px;
        }

        input[type="tel"] {
            min-height: 52px;

            font-size: 16px;
        }

        button {
            min-height: 53px;

            font-size: 15px;
        }

        .login-card > div[style] label {
            font-size: 13px;
        }

        #otp {
            font-size: 21px;

            letter-spacing: 6px;
        }
    }


    /* ==============================
       SMALL MOBILE
       ============================== */

    @media (max-width: 360px) {

        .login-card {
            padding-left: 15px;
            padding-right: 15px;
        }

        h1 {
            font-size: 22px;
        }

        .brand-logo-wrap {
            width: 88px;
            height: 88px;
        }

        .logo {
            width: 76px;
            height: 76px;
        }
    }

</style>
</head>

<body>

<div class="login-card">

    <div class="brand-logo-wrap">
    <img
        class="logo"
        src="/static/helpme-doorstep-logo.png.jpeg"
        alt="HelpMe Doorstep Logo"
    >
</div>

    <h1>HelpMe Doorstep</h1>

    <div class="subtitle">
        Customer Login
    </div>

    <label for="mobile">
        मोबाइल नंबर
    </label>

    <input
        type="tel"
        id="mobile"
        maxlength="10"
        inputmode="numeric"
        placeholder="10 अंकों का मोबाइल नंबर"
    >
    <div style="
    margin-top:18px;
    padding:14px;
    background:#f5f7f8;
    border-radius:10px;
">

<label style="
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    font-weight:normal;
">

<input
    type="checkbox"
    id="termsAccepted"
    value="yes"
    required
    style="width:20px;height:20px;margin-top:3px;"
>

<span>
मैंने
<a href="/terms" target="_blank" rel="noopener">
Terms & Conditions
</a>
और
<a href="/privacy" target="_blank" rel="noopener">
Privacy Policy
</a>
पढ़ ली है और उन्हें स्वीकार करता/करती हूँ।
</span>

</label>

</div>

    <button
        id="sendOtpBtn"
        type="button"
        onclick="sendOTP()">
        📩 OTP भेजें
    </button>

    <div id="otp-box">

        <label for="otp">
            OTP
        </label>

        <input
            type="tel"
            id="otp"
            maxlength="4"
            inputmode="numeric"
            placeholder="4 अंकों का OTP"
        >

        <button
            id="verifyOtpBtn"
            type="button"
            onclick="verifyOTP()">
            🔐 OTP Verify करके Login करें
        </button>

    </div>

    <div id="message" class="message"></div>

    <div class="footer">
        © HelpMe Doorstep
    </div>

</div>


<script>   

let msg91ReqId = null;

var configuration = {

    widgetId: "36696a667454323039343333",

    tokenAuth: "567634T523KiwEkd6aa25285P1",

    exposeMethods: true,   
    
    success: function(data) {

    console.log(
        "MSG91 success:",
        data
    );

    function findJwt(value) {

        if (
            typeof value === "string" &&
            value.split(".").length === 3
        ) {
            return value;
        }

        if (
            value &&
            typeof value === "object"
        ) {
            for (const key in value) {

                const found =
                    findJwt(value[key]);

                if (found) {
                    return found;
                }
            }
        }

        return null;
    }

    window.msg91AccessToken =
        findJwt(data);

    console.log(
        "MSG91 access token:",
        window.msg91AccessToken
    );
},
    
    
failure: function(error) {
    console.log("MSG91 failure:", error);
},

};


function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.className =
        "message " + type;

    message.innerText = text;
}


function sendOTP() {

    const mobile =
        document.getElementById("mobile").value.trim();
    
    const termsAccepted =
        document.getElementById("termsAccepted");

    if (!termsAccepted.checked) {

        showMessage(
            "कृपया पहले Terms & Conditions और Privacy Policy स्वीकार करें।",
            "error"
        );

        return;
    }

    if (!/^\d{10}$/.test(mobile)) {

        showMessage(
            "कृपया सही 10 अंकों का मोबाइल नंबर डालें।",
            "error"
        );

        return;
    }

    const button =
        document.getElementById("sendOtpBtn");

    button.disabled = true;
    button.innerText =
        "OTP भेजा जा रहा है...";


    if (typeof window.sendOtp !== "function") {

        showMessage(
            "MSG91 OTP service अभी load नहीं हुई।",
            "error"
        );

        button.disabled = false;
        button.innerText = "📩 OTP भेजें";

        return;
    }


    window.sendOtp(

        "91" + mobile,   
        
        function(data) {

    console.log(
        "OTP sent:",
        data
    );

    msg91ReqId =
        data && (
            data.message ||
            data.reqId ||
            data.reqID ||
            data["req-id"]
        );

    console.log(
        "MSG91 reqId:",
        msg91ReqId
    );

    document.getElementById(
        "otp-box"
    ).style.display = "block";

        

            document.getElementById(
                "otp"
            ).focus();

            showMessage(
                "OTP आपके मोबाइल नंबर पर भेज दिया गया है।",
                "success"
            );

            button.disabled = false;

            button.innerText =
                "📩 OTP फिर से भेजें";
        },

        function(error) {

            console.log(
                "OTP send error:",
                error
            );

            showMessage(
                "OTP भेजने में समस्या हुई।",
                "error"
            );

            button.disabled = false;

            button.innerText =
                "📩 OTP भेजें";
        }
    );
}


async function verifyOTP() {

    const mobile =
        document.getElementById("mobile").value.trim();

    const otp =
        document.getElementById("otp").value.trim();


    if (!/^\d{10}$/.test(mobile)) {

        showMessage(
            "मोबाइल नंबर सही नहीं है।",
            "error"
        );

        return;
    }


    if (!/^\d{4}$/.test(otp)) {

        showMessage(
            "कृपया 4 अंकों का OTP डालें।",
            "error"
        );

        return;
    }


    const button =
        document.getElementById("verifyOtpBtn");

    button.disabled = true;

    button.innerText =
        "Verify हो रहा है...";


    if (typeof window.verifyOtp !== "function") {

        showMessage(
            "MSG91 OTP service अभी load नहीं हुई।",
            "error"
        );

        button.disabled = false;

        button.innerText =
            "🔐 OTP Verify करके Login करें";

        return;
    }


    window.verifyOtp(

        otp,

        async function(data) {

            console.log(
                "OTP verified:",
                data
            );  
            
            
const accessToken =
    typeof data === "string"
        ? data
        : data && (
            data.accessToken ||
            data["access-token"] ||
            data.token ||
            data.message ||
            data.data?.accessToken ||
            data.data?.["access-token"] ||
            data.data?.token ||
            data.data?.message
        );


            const finalAccessToken =
                accessToken || window.msg91AccessToken;


            if (!finalAccessToken) {

                showMessage(
                    "MSG91 access token नहीं मिला।",
                    "error"
                );

                button.disabled = false;

                button.innerText =
                    "🔐 OTP Verify करके Login करें";

                return;
            }


            try {

                const formData =
                    new FormData();

                formData.append(
                    "mobile",
                    mobile
                );

                formData.append(
                    "access_token",
                    finalAccessToken
                );
                
                formData.append(
                    "terms_accepted",
                   "yes"
                );


                const response =
                    await fetch(
                        "/api/verify-widget-token",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "Server result:",
                    result
                );


                if (result.success) {

                    showMessage(
                        "Login सफल हुआ। Dashboard खोला जा रहा है...",
                        "success"
                    );


                    window.location.href =
                        "/customer/dashboard";

                } else {

                    showMessage(
                        result.message ||
                        "Login failed.",
                        "error"
                    );

                    button.disabled = false;

                    button.innerText =
                        "🔐 OTP Verify करके Login करें";
                }

            } catch (error) {

                console.log(
                    "Server error:",
                    error
                );

                showMessage(
                    "Server से connection में समस्या हुई।",
                    "error"
                );

                button.disabled = false;

                button.innerText =
                    "🔐 OTP Verify करके Login करें";
            }
        },


        function(error) {

            console.log(
                "OTP verification error:",
                error
            );

            showMessage(
                "OTP गलत है या expire हो गया है।",
                "error"
            );

            button.disabled = false;

            button.innerText =
                "🔐 OTP Verify करके Login करें";
        },
        
        msg91ReqId
    );
}

</script>


<script
    type="text/javascript"
    onload="initSendOTP(configuration)"
    src="https://verify.msg91.com/otp-provider.js">
</script>

</body>
</html>
