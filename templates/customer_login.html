<script>
var configuration = {
    widgetId: "36696a667454323039343333",
    tokenAuth: "567634AOKnnoHjjonw6a9aae9bP1",
    exposeMethods: true,

    success: function(data) {
        console.log("MSG91 success:", data);
    },

    failure: function(error) {
        console.log("MSG91 failure:", error);
        showMessage("OTP verification failed.", "error");
    }
};

function showMessage(text, type) {
    const message = document.getElementById("message");
    message.className = "message " + type;
    message.innerText = text;
}

function sendOTP() {
    const mobile = document.getElementById("mobile").value.trim();

    if (!/^\d{10}$/.test(mobile)) {
        showMessage("कृपया सही 10 अंकों का मोबाइल नंबर डालें।", "error");
        return;
    }

    const button = document.getElementById("sendOtpBtn");
    button.disabled = true;
    button.innerText = "OTP भेजा जा रहा है...";

    window.sendOtp(
        "91" + mobile,
        function(data) {
            document.getElementById("otp-box").style.display = "block";
            document.getElementById("otp").focus();

            showMessage(
                "OTP आपके मोबाइल नंबर पर भेज दिया गया है।",
                "success"
            );

            button.disabled = false;
            button.innerText = "📩 OTP फिर से भेजें";
        },
        function(error) {
            console.log(error);

            showMessage(
                "OTP भेजने में समस्या हुई।",
                "error"
            );

            button.disabled = false;
            button.innerText = "📩 OTP फिर से भेजें";
        }
    );
}

function verifyOTP() {
    const mobile = document.getElementById("mobile").value.trim();
    const otp = document.getElementById("otp").value.trim();

    if (!/^\d{10}$/.test(mobile)) {
        showMessage("मोबाइल नंबर सही नहीं है।", "error");
        return;
    }

    if (!/^\d{4}$/.test(otp)) {
        showMessage("कृपया 4 अंकों का OTP डालें।", "error");
        return;
    }

    const button = document.getElementById("verifyOtpBtn");
    button.disabled = true;
    button.innerText = "Verify हो रहा है...";

    window.verifyOtp(
        otp,
        async function(data) {
            console.log("OTP verified:", data);

            const accessToken =
                data && (
                    data.accessToken ||
                    data["access-token"] ||
                    data.token
                );

            if (!accessToken) {
                showMessage(
                    "MSG91 access token नहीं मिला।",
                    "error"
                );
                button.disabled = false;
                button.innerText = "🔐 OTP Verify करके Login करें";
                return;
            }

            const formData = new FormData();
            formData.append("mobile", mobile);
            formData.append("access_token", accessToken);

            const response = await fetch(
                "/api/verify-widget-token",
                {
                    method: "POST",
                    body: formData
                }
            );

            const result = await response.json();

            if (result.success) {
                showMessage(
                    "Login सफल हुआ। Dashboard खोला जा रहा है...",
                    "success"
                );

                window.location.href =
                    "/customer/dashboard";
            } else {
                showMessage(
                    result.message || "Login failed.",
                    "error"
                );

                button.disabled = false;
                button.innerText =
                    "🔐 OTP Verify करके Login करें";
            }
        },
        function(error) {
            console.log(error);

            showMessage(
                "OTP गलत है या expire हो गया है।",
                "error"
            );

            button.disabled = false;
            button.innerText =
                "🔐 OTP Verify करके Login करें";
        }
    );
}
</script>

<script
    type="text/javascript"
    onload="initSendOTP(configuration)"
    src="https://verify.msg91.com/otp-provider.js">
</script>
