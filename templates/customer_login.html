<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>HelpMe Doorstep - Customer Login</title>

   <style>
   *{
    box-sizing:border-box;
}

html,
body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
}

body{
    min-height:100vh;
    color:#173f36;

    background:
        radial-gradient(
            circle at 10% 18%,
            rgba(255,255,255,.95) 0 8%,
            transparent 9%
        ),
        radial-gradient(
            circle at 90% 12%,
            rgba(255,255,255,.80) 0 10%,
            transparent 11%
        ),
        linear-gradient(
            135deg,
            #eafcff 0%,
            #f5fffb 42%,
            #e8f5ff 100%
        );

    position:relative;
    overflow-x:hidden;
}

/* ==============================
   PROFESSIONAL WAVE BACKGROUND
   ============================== */

body::before{
    content:"";
    position:fixed;
    left:-15%;
    top:120px;
    width:130%;
    height:380px;

    background:
        linear-gradient(
            135deg,
            rgba(71,201,174,.20),
            rgba(74,174,255,.16),
            rgba(255,255,255,.20)
        );

    border-radius:50% 50% 45% 55%;
    transform:rotate(-4deg);

    z-index:0;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    right:-20%;
    bottom:-120px;
    width:120%;
    height:330px;

    background:
        linear-gradient(
            135deg,
            rgba(32,181,143,.12),
            rgba(61,157,255,.14)
        );

    border-radius:55% 45% 0 0;
    transform:rotate(4deg);

    z-index:0;
    pointer-events:none;
}

/* ==============================
   MAIN LOGIN AREA
   ============================== */

body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding:30px 16px;
}

/* ==============================
   CUSTOMER LOGIN CARD
   ============================== */

.login-card{
    width:min(560px,100%);
    margin:0 auto;

    background:rgba(255,255,255,.97);

    border:1px solid rgba(42,143,125,.18);

    border-radius:30px;

    padding:34px 32px 24px;

    box-shadow:
        0 25px 65px rgba(25,87,77,.15),
        0 5px 18px rgba(50,140,170,.08);

    backdrop-filter:blur(8px);

    position:relative;
    z-index:2;
}

/* ==============================
   LOGO
   ============================== */

.brand-logo-wrap{
    width:110px;
    height:110px;

    margin:0 auto 18px;

    padding:7px;

    background:#ffffff;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid #dcebe7;

    box-shadow:
        0 10px 28px rgba(21,101,192,.15);
}

.logo{
    width:94px;
    height:94px;

    object-fit:contain;

    display:block;

    border-radius:50%;
}

/* ==============================
   TITLE
   ============================== */

h1{
    margin:0;

    text-align:center;

    color:#0d5748;

    font-size:32px;
    line-height:1.2;

    font-weight:800;

    letter-spacing:-.4px;
}

.subtitle{
    text-align:center;

    margin-top:8px;
    margin-bottom:30px;

    color:#5d6e69;

    font-size:17px;

    line-height:1.5;

    font-weight:600;
}

/* ==============================
   LABEL
   ============================== */

label{
    display:block;

    margin:0 0 9px;

    color:#145445;

    font-size:17px;

    font-weight:800;
}

/* ==============================
   MOBILE INPUT
   ============================== */

input[type="tel"]{
    width:100%;

    height:58px;

    padding:0 17px;

    border:1.5px solid #c9ded8;

    border-radius:16px;

    background:#fbfefd;

    color:#173e36;

    font-size:17px;

    outline:none;

    transition:
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

input[type="tel"]::placeholder{
    color:#8a9995;
}

input[type="tel"]:focus{
    border-color:#16aa82;

    background:#ffffff;

    box-shadow:
        0 0 0 4px rgba(22,170,130,.10);
}

/* ==============================
   TERMS & PRIVACY BOX
   ============================== */

.login-card > div[style]{
    margin-top:18px !important;

    padding:15px 16px !important;

    background:
        linear-gradient(
            135deg,
            #effbf7,
            #f4fbff
        ) !important;

    border:1px solid #d5ebe4;

    border-radius:17px !important;
}

.login-card > div[style] label{
    display:flex;

    align-items:flex-start;

    gap:11px;

    margin:0 !important;

    color:#52635f;

    font-size:14px;

    line-height:1.55;

    font-weight:400;
}

.login-card > div[style] input[type="checkbox"]{
    width:21px !important;
    height:21px !important;

    flex:0 0 21px;

    margin:2px 0 0 !important;

    accent-color:#159d79;

    cursor:pointer;
}

.login-card a{
    color:#075ca8;

    font-weight:800;

    text-decoration:none;
}

.login-card a:hover{
    text-decoration:underline;
}

/* ==============================
   BUTTONS
   ============================== */

button{
    width:100%;

    min-height:56px;

    margin-top:17px;

    padding:14px 18px;

    border:0;

    border-radius:16px;

    background:
        linear-gradient(
            135deg,
            #159d79,
            #087f68
        );

    color:#ffffff;

    font-size:17px;

    font-weight:800;

    letter-spacing:.1px;

    cursor:pointer;

    box-shadow:
        0 9px 20px rgba(21,157,121,.22);

    transition:
        transform .15s ease,
        box-shadow .15s ease,
        opacity .15s ease;
}

button:hover{
    transform:translateY(-1px);

    box-shadow:
        0 12px 25px rgba(21,157,121,.28);
}

button:active{
    transform:translateY(0);
}

button:disabled{
    background:#aeb8c2;

    box-shadow:none;

    cursor:not-allowed;

    transform:none;

    opacity:.9;
}

/* ==============================
   OTP SECTION
   ============================== */

#otp-box{
    display:none;

    margin-top:24px;

    padding-top:4px;
}

#otp-box label{
    margin-bottom:9px;
}

/* ==============================
   OTP INPUT
   ============================== */

#otp{
    width:100%;

    min-height:60px;

    text-align:center;

    letter-spacing:7px;

    font-size:23px;

    font-weight:800;

    border:1.5px solid #c9ded8;

    border-radius:16px;

    background:#fbfefd;
}

#otp:focus{
    border-color:#16aa82;

    box-shadow:
        0 0 0 4px rgba(22,170,130,.10);
}

/* ==============================
   MESSAGE
   ============================== */

.message{
    margin-top:18px;

    padding:13px 15px;

    border-radius:13px;

    text-align:center;

    font-size:14px;

    line-height:1.5;

    display:none;

    border:1px solid transparent;
}

.message.success{
    display:block;

    background:#ecfdf3;

    color:#067647;

    border-color:#abefc6;
}

.message.error{
    display:block;

    background:#fef3f2;

    color:#b42318;

    border-color:#fecdca;
}

/* ==============================
   FOOTER
   ============================== */

.footer{
    text-align:center;

    margin-top:24px;

    padding-top:16px;

    border-top:1px solid #edf1f5;

    color:#98a2b3;

    font-size:12px;
}

/* ==============================
   LAPTOP / DESKTOP
   ============================== */

@media (min-width:769px){

    .login-card{
        max-width:560px;

        padding:
            38px
            38px
            26px;
    }

    .brand-logo-wrap{
        width:116px;
        height:116px;
    }

    .logo{
        width:100px;
        height:100px;
    }

    h1{
        font-size:34px;
    }

    .subtitle{
        font-size:17px;
        margin-bottom:32px;
    }
}

/* ==============================
   MOBILE
   ============================== */

@media (max-width:600px){

    body{
        padding:16px 10px;
    }

    .login-card{
        width:100%;

        padding:
            28px
            18px
            21px;

        border-radius:24px;
    }

    .brand-logo-wrap{
        width:96px;
        height:96px;

        margin-bottom:15px;
    }

    .logo{
        width:82px;
        height:82px;
    }

    h1{
        font-size:25px;
    }

    .subtitle{
        font-size:14px;

        margin-top:7px;
        margin-bottom:25px;
    }

    label{
        font-size:15px;
    }

    input[type="tel"]{
        height:54px;

        font-size:16px;
    }

    button{
        min-height:54px;

        font-size:16px;
    }

    .login-card > div[style] label{
        font-size:13px;
    }

    #otp{
        min-height:57px;

        font-size:22px;

        letter-spacing:6px;
    }
}

/* ==============================
   SMALL MOBILE
   ============================== */

@media (max-width:360px){

    body{
        padding:10px 8px;
    }

    .login-card{
        padding:
            24px
            14px
            18px;

        border-radius:21px;
    }

    .brand-logo-wrap{
        width:88px;
        height:88px;
    }

    .logo{
        width:75px;
        height:75px;
    }

    h1{
        font-size:23px;
    }

    .subtitle{
        font-size:13px;
    }

    .login-card > div[style]{
        padding:12px !important;
    }

    .login-card > div[style] label{
        font-size:12.5px;
    }
}

/* ==============================
   PROFESSIONAL BOTTOM FOOTER
   ============================== */

body{
    display:block;
    min-height:100vh;
    padding:0;
}

.login-card{
    margin:40px auto 45px;
}

.login-card > .footer{
    display:none;
}

.site-footer{
    width:100%;
    background:linear-gradient(135deg,#004e48,#00685e);
    color:#fff;
    padding:24px 5%;
    margin-top:20px;
}

.site-footer-inner{
    max-width:1400px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.site-footer-brand{
    display:flex;
    align-items:center;
    gap:14px;
}

.site-footer-brand img{
    width:72px;
    height:72px;
    object-fit:contain;
    background:#fff;
    border-radius:50%;
    padding:4px;
}

.site-footer-brand strong{
    font-size:23px;
    display:block;
}

.site-footer-brand span{
    font-size:13px;
    opacity:.9;
}

.site-footer-right{
    text-align:right;
    font-size:13px;
    line-height:1.8;
}

.site-footer-right a{
    color:#fff;
    text-decoration:none;
    font-weight:700;
}

.site-footer-right a:hover{
    text-decoration:underline;
}

/* ===================== SOCIAL MEDIA FOOTER ===================== */

.social-title{
    margin:10px 0 8px;
    color:#345b54;
    font-size:13px;
    font-weight:700;
    text-align:center;
}

.social-links{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin:10px 0 12px;
}

.social-links a{
    width:42px;
    height:42px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#f1f7f5;
    border:1px solid #dcebe7;
    text-decoration:none;
    transition:0.2s ease;
}

.social-links a:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 12px rgba(20,70,60,.14);
    background:#e5f2ee;
}

.social-links a:nth-child(1){
    color:#E1306C;
}

.social-links a:nth-child(2){
    color:#1877F2;
}

.social-links a:nth-child(3){
    color:#229ED9;
}

.social-links a:nth-child(4){
    color:#FF0000;
}

.social-links svg{
    width:20px;
    height:20px;
    display:block;
    fill:currentColor;
}

@media(max-width:700px){

    .login-card{
        margin:22px auto 30px;
    }

    .site-footer{
        padding:22px 16px;
    }

    .site-footer-inner{
        flex-direction:column;
        text-align:center;
    }

    .site-footer-brand{
        justify-content:center;
    }

    .site-footer-brand strong{
        font-size:19px;
    }

    .site-footer-right{
        text-align:center;
    }

    .site-footer-brand img{
        width:62px;
        height:62px;
    }
}   

.back-login{
    display:block;
    width:min(560px,92%);
    margin:0 auto 20px;
    padding:11px 15px;
    text-align:center;
    background:#eef7f4;
    color:#075e54;
    border:1px solid #d5e8e2;
    border-radius:10px;
    text-decoration:none;
    font-weight:700;
    font-size:14px;
}

.back-login:hover{
    background:#e0f1ec;
}
       
</style>
</head>

<body>

<div class="login-card">

    <div class="brand-logo-wrap">
    <img
        class="logo"
        src="/static/helpme-doorstep-flat-logo.png.jpeg"
        alt="HelpMe Doorstep Logo"
    >
</div>

    <h1>HelpMe Doorstep</h1>

    <div class="subtitle">
        Customer Login
    </div>

    <label for="mobile">
        मोबाइल नंबर
    </label>

    <input
        type="tel"
        id="mobile"
        maxlength="10"
        inputmode="numeric"
        placeholder="10 अंकों का मोबाइल नंबर"
    >
    <div style="
    margin-top:18px;
    padding:14px;
    background:#f5f7f8;
    border-radius:10px;
">

<label style="
    display:flex;
    align-items:flex-start;
    gap:10px;
    cursor:pointer;
    font-weight:normal;
">

<input
    type="checkbox"
    id="termsAccepted"
    value="yes"
    required
    style="width:20px;height:20px;margin-top:3px;"
>

<span>
मैंने
<a href="/terms" target="_blank" rel="noopener">
Terms & Conditions
</a>
और
<a href="/privacy" target="_blank" rel="noopener">
Privacy Policy
</a>
पढ़ ली है और उन्हें स्वीकार करता/करती हूँ।
</span>

</label>

</div>

    <button
        id="sendOtpBtn"
        type="button"
        onclick="sendOTP()">
        📩 OTP भेजें
    </button>

    <div id="otp-box">

        <label for="otp">
            OTP
        </label>

        <input
            type="tel"
            id="otp"
            maxlength="4"
            inputmode="numeric"
            placeholder="4 अंकों का OTP"
        >

        <button
            id="verifyOtpBtn"
            type="button"
            onclick="verifyOTP()">
            🔐 OTP Verify करके Login करें
        </button>

    </div>

    <div id="message" class="message"></div>

    <div class="footer">
        © HelpMe Doorstep
    </div>

</div>


<script>   

let msg91ReqId = null;

var configuration = {

    widgetId: "36696a667454323039343333",

    tokenAuth: "567634T523KiwEkd6aa25285P1",

    exposeMethods: true,   
    
    success: function(data) {

    console.log(
        "MSG91 success:",
        data
    );

    function findJwt(value) {

        if (
            typeof value === "string" &&
            value.split(".").length === 3
        ) {
            return value;
        }

        if (
            value &&
            typeof value === "object"
        ) {
            for (const key in value) {

                const found =
                    findJwt(value[key]);

                if (found) {
                    return found;
                }
            }
        }

        return null;
    }

    window.msg91AccessToken =
        findJwt(data);

    console.log(
        "MSG91 access token:",
        window.msg91AccessToken
    );
},
    
    
failure: function(error) {
    console.log("MSG91 failure:", error);
},

};


function showMessage(text, type) {

    const message =
        document.getElementById("message");

    message.className =
        "message " + type;

    message.innerText = text;
}


function sendOTP() {

    const mobile =
        document.getElementById("mobile").value.trim();
    
    const termsAccepted =
        document.getElementById("termsAccepted");

    if (!termsAccepted.checked) {

        showMessage(
            "कृपया पहले Terms & Conditions और Privacy Policy स्वीकार करें।",
            "error"
        );

        return;
    }

    if (!/^\d{10}$/.test(mobile)) {

        showMessage(
            "कृपया सही 10 अंकों का मोबाइल नंबर डालें।",
            "error"
        );

        return;
    }

    const button =
        document.getElementById("sendOtpBtn");

    button.disabled = true;
    button.innerText =
        "OTP भेजा जा रहा है...";


    if (typeof window.sendOtp !== "function") {

        showMessage(
            "MSG91 OTP service अभी load नहीं हुई।",
            "error"
        );

        button.disabled = false;
        button.innerText = "📩 OTP भेजें";

        return;
    }


    window.sendOtp(

        "91" + mobile,   
        
        function(data) {

    console.log(
        "OTP sent:",
        data
    );

    msg91ReqId =
        data && (
            data.message ||
            data.reqId ||
            data.reqID ||
            data["req-id"]
        );

    console.log(
        "MSG91 reqId:",
        msg91ReqId
    );

    document.getElementById(
        "otp-box"
    ).style.display = "block";

        

            document.getElementById(
                "otp"
            ).focus();

            showMessage(
                "OTP आपके मोबाइल नंबर पर भेज दिया गया है।",
                "success"
            );

            button.disabled = false;

            button.innerText =
                "📩 OTP फिर से भेजें";
        },

        function(error) {

            console.log(
                "OTP send error:",
                error
            );

            showMessage(
                "OTP भेजने में समस्या हुई।",
                "error"
            );

            button.disabled = false;

            button.innerText =
                "📩 OTP भेजें";
        }
    );
}


async function verifyOTP() {

    const mobile =
        document.getElementById("mobile").value.trim();

    const otp =
        document.getElementById("otp").value.trim();


    if (!/^\d{10}$/.test(mobile)) {

        showMessage(
            "मोबाइल नंबर सही नहीं है।",
            "error"
        );

        return;
    }


    if (!/^\d{4}$/.test(otp)) {

        showMessage(
            "कृपया 4 अंकों का OTP डालें।",
            "error"
        );

        return;
    }


    const button =
        document.getElementById("verifyOtpBtn");

    button.disabled = true;

    button.innerText =
        "Verify हो रहा है...";


    if (typeof window.verifyOtp !== "function") {

        showMessage(
            "MSG91 OTP service अभी load नहीं हुई।",
            "error"
        );

        button.disabled = false;

        button.innerText =
            "🔐 OTP Verify करके Login करें";

        return;
    }


    window.verifyOtp(

        otp,

        async function(data) {

            console.log(
                "OTP verified:",
                data
            );  
            
            
const accessToken =
    typeof data === "string"
        ? data
        : data && (
            data.accessToken ||
            data["access-token"] ||
            data.token ||
            data.message ||
            data.data?.accessToken ||
            data.data?.["access-token"] ||
            data.data?.token ||
            data.data?.message
        );


            const finalAccessToken =
                accessToken || window.msg91AccessToken;


            if (!finalAccessToken) {

                showMessage(
                    "MSG91 access token नहीं मिला।",
                    "error"
                );

                button.disabled = false;

                button.innerText =
                    "🔐 OTP Verify करके Login करें";

                return;
            }


            try {

                const formData =
                    new FormData();

                formData.append(
                    "mobile",
                    mobile
                );

                formData.append(
                    "access_token",
                    finalAccessToken
                );
                
                formData.append(
                    "terms_accepted",
                   "yes"
                );

                formData.append(
                    "csrf_token",
                   "{{ csrf_token() }}"
                );
                
                const response =
                    await fetch(
                        "/api/verify-widget-token",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                console.log(
                    "Server result:",
                    result
                );


                if (result.success) {

                    showMessage(
                        "Login सफल हुआ। Dashboard खोला जा रहा है...",
                        "success"
                    );


                    window.location.href =
                        "/customer/dashboard";

                } else {

                    showMessage(
                        result.message ||
                        "Login failed.",
                        "error"
                    );

                    button.disabled = false;

                    button.innerText =
                        "🔐 OTP Verify करके Login करें";
                }

            } catch (error) {

                console.log(
                    "Server error:",
                    error
                );

                showMessage(
                    "Server से connection में समस्या हुई।",
                    "error"
                );

                button.disabled = false;

                button.innerText =
                    "🔐 OTP Verify करके Login करें";
            }
        },


        function(error) {

            console.log(
                "OTP verification error:",
                error
            );

            showMessage(
                "OTP गलत है या expire हो गया है।",
                "error"
            );

            button.disabled = false;

            button.innerText =
                "🔐 OTP Verify करके Login करें";
        },
        
        msg91ReqId
    );
}

</script>


<script
    type="text/javascript"
    onload="initSendOTP(configuration)"
    src="https://verify.msg91.com/otp-provider.js">
</script>

<a href="/login" class="back-login">
    ← Back to Login Portal
</a>
    
<footer class="site-footer">

    <div class="site-footer-inner">
