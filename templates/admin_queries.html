<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Queries - HelpMe Doorstep</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .queries-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .queries-header h1 {
            margin: 0;
        }

        .dashboard-btn {
            display: inline-block;
            padding: 10px 16px;
            background: #0870b9;
            color: #ffffff;
            text-decoration: none;
            border-radius: 9px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .summary-card {
            background: #ffffff;
            border: 1px solid #dce9e5;
            border-radius: 15px;
            padding: 18px;
            text-align: center;
        }

        .summary-number {
            font-size: 28px;
            font-weight: bold;
            margin-top: 6px;
        }

        .query-card {
            background: #ffffff;
            border: 1px solid #dce9e5;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .query-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 15px;
            flex-wrap: wrap;
        }

        .query-id {
            font-size: 20px;
            font-weight: bold;
        }

        .query-date {
            color: #71847e;
            font-size: 14px;
            margin-top: 5px;
        }

        .status-badge {
            display: inline-block;
            padding: 7px 12px;
            border-radius: 20px;
            font-weight: bold;
            background: #fff3cd;
            color: #856404;
        }

        .query-info {
            margin-top: 15px;
            line-height: 1.7;
        }

        .query-details {
            margin-top: 12px;
            padding: 14px;
            background: #f5f8f7;
            border-radius: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .status-form {
            margin-top: 16px;
            padding-top: 15px;
            border-top: 1px solid #e4ece8;
        }

        .status-form select {
            max-width: 300px;
        }

        .update-btn {
            width: auto;
            padding: 10px 18px;
            margin-top: 10px;
            background: #168b62;
        }

        .empty-box {
            text-align: center;
            padding: 40px 20px;
            background: #ffffff;
            border: 1px solid #dce9e5;
            border-radius: 16px;
        }

        @media (max-width: 600px) {

            .queries-header {
                align-items: stretch;
            }

            .queries-header h1 {
                font-size: 24px;
            }

            .dashboard-btn {
                text-align: center;
                width: 100%;
            }

            .summary-grid {
                grid-template-columns: 1fr;
            }

            .query-card {
                padding: 15px;
            }

            .query-top {
                display: block;
            }

            .query-id {
                font-size: 18px;
                margin-bottom: 8px;
            }

            .status-badge {
                margin-top: 10px;
            }

            .status-form select {
                max-width: 100%;
            }

            .update-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="brand">

        <img
            class="brand-logo"
            src="/static/WhatsApp%20Image%202026-09-13%20at%2012.32.28.jpeg"
            alt="HelpMe Doorstep Logo">

    </div>

</header>


<main>


    <div class="card">


        <div class="queries-header">

            <h1>
                ❓ Customer Queries
            </h1>

            <a
                href="/admin"
                class="dashboard-btn">

                ← Admin Dashboard

            </a>

        </div>


        <!-- SUMMARY -->

        <div class="summary-grid">


            <div class="summary-card">

                <div>
                    Total Queries
                </div>

                <div class="summary-number">

                    {{ queries|length }}

                </div>

            </div>


            <div class="summary-card">

                <div>
                    Pending
                </div>

                <div class="summary-number">

                    {{
                        queries
                        |selectattr("status", "equalto", "Pending")
                        |list
                        |length
                    }}

                </div>
