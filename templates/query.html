<!DOCTYPE html>
<html lang="hi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Any Query - HelpMe Doorstep</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .query-box {
            max-width: 650px;
            margin: 30px auto;
        }

        .query-title {
            text-align: center;
            margin-bottom: 8px;
        }

        .query-subtitle {
            text-align: center;
            color: #5f716b;
            margin-bottom: 25px;
        }

        .required {
            color: #d32f2f;
        }

        .notice {
            background: #e8f4ff;
            border: 1px solid #b7dcf7;
            color: #174a6b;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .submit-btn {
            margin-top: 18px;
            background: #0870b9;
        }

        .home-btn {
            display: block;
            width: fit-content;
            margin: 18px auto 0;
            padding: 10px 18px;
            background: #168b62;
            color: #ffffff;
            text-decoration: none;
            border-radius: 9px;
        }

        @media (max-width: 600px) {

            .query-box {
                margin: 15px auto;
            }

            .query-title {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


<header>

    <div class="brand">

        <img
            class="brand-logo"
            src="/static/WhatsApp%20Image%202026-09-13%20at%2012.32.28.jpeg"
            alt="HelpMe Doorstep Logo">

    </div>

</header>


<main>


    <div class="card query-box">


        <h1 class="query-title">
            ❓ Any Query
        </h1>


        <p class="query-subtitle">
            अपने सवाल या जानकारी से संबंधित Query भेजें।
        </p>


        <div class="notice">

            ℹ️ आपकी Query HelpMe Doorstep Admin/Support
            Team तक भेजी जाएगी।

            <br>

            ⚠️ OTP, Password या किसी भी confidential
            जानकारी को Query में न लिखें।

        </div>


        <form
            method="post"
            action="/query">


            <label for="application_code">

                Application ID
                <span class="required">*</span>

            </label>


            <input
                type="text"
                id="application_code"
                name="application_code"
                placeholder="जैसे HM/DS01"
                maxlength="30"
                required>


            <label for="phone">

                Mobile Number
                <span class="required">*</span>

            </label>


            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="10 अंकों का Mobile Number"
                inputmode="numeric"
                maxlength="10"
                pattern="[0-9]{10}"
                required>


            <label for="category">

                Query Category
                <span class="required">*</span>

            </label>


            <select
                id="category"
                name="category"
                required>


                <option value="">
                    -- Query Category चुनें --
                </option>


                <option value="Service Information">
                    Service Information
                </option>


                <option value="Application Related">
                    Application Related
                </option>


                <option value="Payment Related">
                    Payment Related
                </option>


                <option value="CSC/CSP Related">
                    CSC/CSP Related
                </option>


                <option value="Worker/Employee Related">
                    Worker/Employee Related
                </option>


                <option value="Website Related">
                    Website Related
                </option>


                <option value="Other">
                    Other
                </option>


            </select>


            <label for="details">

                Query Details
                <span class="required">*</span>

            </label>


            <textarea
                id="details"
                name="details"
                rows="6"
                maxlength="2000"
                placeholder="अपना सवाल विस्तार से लिखें..."
                required></textarea>


            <button
                type="submit"
                class="submit-btn">

                ❓ Query Submit करें

            </button>


        </form>


        <a
            href="/"
            class="home-btn">

            🏠 Home

        </a>


    </div>


</main>


</body>

</html>
