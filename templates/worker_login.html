<!doctype html>
<html lang="hi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Worker OTP Login - HelpMe Doorstep</title>

<link rel="stylesheet" href="/static/style.css">

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    min-height:100%;
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
}

body{
    min-height:100vh;
    color:#173f36;
    background:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,.95) 0 8%, transparent 9%),
        radial-gradient(circle at 90% 12%, rgba(255,255,255,.80) 0 10%, transparent 11%),
        linear-gradient(135deg,#eafcff 0%,#f5fffb 42%,#e8f5ff 100%);
    position:relative;
    overflow-x:hidden;
}

/* ===== PROFESSIONAL WAVE BACKGROUND ===== */

body::before{
    content:"";
    position:fixed;
    left:-15%;
    top:150px;
    width:130%;
    height:360px;
    background:linear-gradient(
        135deg,
        rgba(71,201,174,.20),
        rgba(74,174,255,.16),
        rgba(255,255,255,.20)
    );
    border-radius:50% 50% 45% 55%;
    transform:rotate(-4deg);
    z-index:0;
    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;
    right:-20%;
    bottom:-120px;
    width:120%;
    height:330px;
    background:linear-gradient(
        135deg,
        rgba(32,181,143,.12),
        rgba(61,157,255,.14)
    );
    border-radius:55% 45% 0 0;
    transform:rotate(4deg);
    z-index:0;
    pointer-events:none;
}

/* ===== TOP HEADER ===== */

header{
    width:100%;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid rgba(29,120,105,.12);
    box-shadow:0 5px 20px rgba(24,75,70,.10);
    padding:10px 12px;
    position:relative;
    z-index:5;
}

header .brand{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* ===== FLAT LOGO ===== */

.flat-logo{
    width:min(520px,92vw);
    height:105px;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
}

.flat-logo img{
    display:block;
    width:100%;
    height:100%;
    object-fit:contain;
    object-position:center;
}

/* ===== MAIN ===== */

main{
    min-height:calc(100vh - 130px);
    padding:35px 14px 45px;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    position:relative;
    z-index:2;
}

/* ===== LOGIN CARD ===== */

.login-card{
    width:min(560px,100%);
    margin:0 auto;
    background:rgba(255,255,255,.97);
    border:1px solid rgba(42,143,125,.18);
    border-radius:30px;
    padding:32px;
    box-shadow:
        0 25px 65px rgba(25,87,77,.15),
        0 5px 18px rgba(50,140,170,.08);
    backdrop-filter:blur(8px);
}

/* ===== WORKER HEADING ===== */

.login-card h1{
    margin:0 0 10px;
    color:#0d5748;
    font-size:32px;
    line-height:1.2;
    font-weight:800;
    letter-spacing:-.4px;
}

.login-card p{
    color:#5d6e69;
    font-size:17px;
    line-height:1.6;
    margin:8px 0 25px;
}

/* ===== LABEL ===== */

.login-card label{
    display:block;
    color:#145445;
    font-weight:800;
    font-size:17px;
    margin:0 0 9px;
}

/* ===== MOBILE INPUT ===== */

.login-card input[type="tel"]{
    width:100%;
    height:58px;
    padding:0 17px;
    border:1.5px solid #c9ded8;
    border-radius:16px;
    background:#fbfefd;
    color:#173e36;
    font-size:17px;
    outline:none;
    transition:.2s ease;
}

.login-card input[type="tel"]:focus{
    border-color:#16aa82;
    box-shadow:0 0 0 4px rgba(22,170,130,.10);
}

/* ===== TERMS ===== */

.terms-box{
    margin-top:17px;
    padding:15px 16px;
    border-radius:17px;
    background:linear-gradient(135deg,#effbf7,#f4fbff);
    border:1px solid #d5ebe4;
}

.terms-label{
    display:flex !important;
    align-items:flex-start;
    gap:11px;
    margin:0 !important;
    color:#52635f !important;
    font-weight:400 !important;
    line-height:1.55;
}

.terms-label input[type="checkbox"]{
    width:21px;
    height:21px;
    flex:0 0 21px;
    margin:2px 0 0;
    accent-color:#159d79;
    cursor:pointer;
}

.terms-label span{
    font-size:14px;
}

.terms-label a{
    color:#1768a3;
    font-weight:700;
    text-decoration:underline;
}

/* ===== OTP BUTTON ===== */

.login-card button{
    width:100%;
    min-height:58px;
    margin-top:18px;
    padding:14px 18px;
    border:0;
    border-radius:16px;
    background:linear-gradient(135deg,#18b98a,#079c76);
    color:#fff;
    font-size:18px;
    font-weight:800;
    cursor:pointer;
    box-shadow:0 10px 25px rgba(10,157,118,.22);
    transition:.2s ease;
}

.login-card button:hover{
    transform:translateY(-2px);
    box-shadow:0 13px 28px rgba(10,157,118,.28);
}

.login-card button:active{
    transform:translateY(0);
}

.login-card button:disabled{
    opacity:.65;
    cursor:not-allowed;
    box-shadow:none;
}

/* ===== OTP AREA ===== */

.otp-box{
    display:none;
    margin-top:24px;
    padding-top:22px;
    border-top:1px dashed #c8ded7;
}

.otp-box input{
    width:100%;
    height:58px;
    padding:0 17px;
    border:1.5px solid #c9ded8;
    border-radius:16px;
    background:#fbfefd;
    font-size:19px;
    text-align:center;
    letter-spacing:5px;
    outline:none;
}

.otp-box input:focus{
    border-color:#16aa82;
    box-shadow:0 0 0 4px rgba(22,170,130,.10);
}

/* ===== MESSAGE ===== */

.message{
    margin-top:16px;
    padding:13px 15px;
    border-radius:13px;
    text-align:center;
    font-weight:700;
    font-size:14px;
    line-height:1.5;
}

.message:empty{
    display:none;
}

.success{
    background:#eaf9f2;
    color:#16764f;
    border:1px solid #c8eadc;
}

.error{
    background:#fff0f0;
    color:#b42318;
    border:1px solid #f1cccc;
}

/* ===== REGISTRATION ===== */

.register-link{
    text-align:center;
    margin-top:22px;
    color:#596c67;
    font-size:16px;
    line-height:1.8;
}

.register-link a{
    display:inline-block;
    margin-top:3px;
    color:#159b77;
    font-weight:800;
    text-decoration:none;
    font-size:17px;
}

/* ===== BACK HOME ===== */

.back-link{
    text-align:center;
    margin-top:20px;
}

.back-link a{
    color:#586b66;
    font-weight:700;
    text-decoration:none;
    font-size:16px;
}

/* ===== MOBILE ===== */

@media (max-width:600px){

    header{
        padding:7px 7px 5px;
    }

    .flat-logo{
        width:96vw;
        height:92px;
    }

    main{
        min-height:calc(100vh - 105px);
        padding:24px 10px 35px;
    }

    .login-card{
        width:100%;
        border-radius:27px;
        padding:25px 18px 27px;
    }

    .login-card h1{
        font-size:29px;
    }

    .login-card p{
        font-size:16px;
        margin-bottom:22px;
    }

    .login-card label{
        font-size:16px;
    }

    .login-card input[type="tel"]{
        height:56px;
        font-size:16px;
    }

    .login-card button{
        min-height:56px;
        font-size:17px;
    }

    .terms-box{
        padding:14px 13px;
    }

    .terms-label span{
        font-size:13px;
    }

    .register-link{
        font-size:15px;
    }

    .back-link a{
        font-size:15px;
    }
}

/* ===== SMALL MOBILE ===== */

@media (max-width:390px){

    .flat-logo{
        height:82px;
    }

    main{
        padding:18px 8px 30px;
    }

    .login-card{
        padding:22px 15px 24px;
        border-radius:24px;
    }

    .login-card h1{
        font-size:26px;
    }

    .login-card p{
        font-size:15px;
    }
}
</style>

</head>

<body>

<header>

    <div class="brand">

        <div class="flat-logo">

            <img
                src="/static/WhatsApp%20Image%202026-09-13%20at%2012.32.28.jpeg"
                alt="HelpMe Doorstep"
            >

        </div>

    </div>

</header>

<main>

<div class="login-card">

<h1>👨‍🔧 Worker Login</h1>

<p>
Registered Mobile Number डालें और OTP से Login करें।
</p>


<div id="mobile-box">

<label>
मोबाइल नंबर
</label>

<input
    type="tel"
    id="mobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="10 अंकों का मोबाइल नंबर"
>

<div class="terms-box">

    <label class="terms-label">

        <input
            type="checkbox"
            id="termsAccepted"
        >

        <span>
            मैंने
            <a href="/terms" target="_blank">
                Terms & Conditions
            </a>
            और
            <a href="/privacy" target="_blank">
                Privacy Policy
            </a>
            पढ़ ली है और उन्हें स्वीकार करता/करती हूँ।
        </span>

    </label>

</div>
    
<button
    type="button"
    id="sendOtpBtn"
    onclick="sendOTP()"
>
📩 OTP भेजें
</button>

</div>


<div
    class="otp-box"
    id="otp-box"
>

<label>
4 अंकों का OTP
</label>

<input
    type="tel"
    id="otp"
    maxlength="4"
    inputmode="numeric"
    placeholder="4 Digit OTP"
>

<button
    type="button"
    id="verifyOtpBtn"
    onclick="verifyOTP()"
>
🔐 OTP Verify करके Login करें
</button>

</div>


<div id="message"></div>


<div class="register-link">

नए Service Provider हैं?

<br>

<a href="/worker/register">
👉 Registration करें
</a>

</div>


<div class="back-link">

<a href="/">
← Home पर वापस जाएँ
</a>

</div>

</div>

</main>


<!-- =========================
     MSG91 OTP WIDGET
========================= -->

<script type="text/javascript">

let widgetReady = false;
    
let msg91ReqId = null;

let widgetConfiguration = {

    widgetId: "36696a667454323039343333",

    tokenAuth: "567634T523KiwEkd6aa25285P1",

    exposeMethods: true,

    success: function(data) {

        console.log(
            "MSG91 Widget Success:",
            data
        );
        
        msg91ReqId =
        data && (
        data.message ||
        data.reqId ||
        data.reqID ||
        data["req-id"]
    );

console.log(
    "MSG91 reqId:",
    msg91ReqId
);

    },

    failure: function(error) {

        console.log(
            "MSG91 Widget Failure:",
            error
        );

    }

};

function loadMSG91Widget() {

    if (
        document.getElementById(
            "msg91-widget-script"
        )
    ) {
        return;
    }

    const script =
        document.createElement("script");

    script.id =
        "msg91-widget-script";

    script.type =
        "text/javascript";

    script.src =
        "https://verify.msg91.com/otp-provider.js";

    script.onload = function() {

        try {

            initSendOTP(
                widgetConfiguration
            );

            widgetReady = true;

        } catch (error) {

            console.error(
                "MSG91 Widget Init Error:",
                error
            );

        }

    };

    document.head.appendChild(script);

}

loadMSG91Widget();


async function sendOTP() {

    const mobile =
        document.getElementById("mobile").value.trim();
    
    const termsAccepted =
        document.getElementById("termsAccepted").checked;

    if (!termsAccepted) {

    message.className = "message error";

    message.innerText =
        "OTP भेजने से पहले Terms & Conditions और Privacy Policy स्वीकार करना जरूरी है।";

    return;
}

    const button =
        document.getElementById("sendOtpBtn");

    const message =
        document.getElementById("message");

    message.className = "";
    message.innerText = "";

    if (!/^\d{10}$/.test(mobile)) {

        message.className = "message error";

        message.innerText =
            "कृपया सही 10 अंकों का मोबाइल नंबर डालें।";

        return;
    }

    if (
        typeof window.sendOtp !== "function"
    ) {

        message.className = "message error";

        message.innerText =
            "OTP Service अभी तैयार नहीं है। कृपया कुछ सेकंड बाद फिर प्रयास करें।";

        return;
    }

    button.disabled = true;

    button.innerText =
        "OTP भेजा जा रहा है...";

    const identifier =
        "91" + mobile;

    try {

        window.sendOtp(
            identifier,

            function (data) {

                console.log(
                    "MSG91 OTP SUCCESS:",
                    data
                );

                document
                    .getElementById("otp-box")
                    .style.display = "block";

                message.className =
                    "message success";

                message.innerText =
                    "OTP आपके मोबाइल नंबर पर भेज दिया गया है।";

                document
                    .getElementById("otp")
                    .focus();

                button.innerText =
                    "📩 OTP फिर से भेजें";

                button.disabled = false;
            },

            function (error) {

                console.error(
                    "MSG91 OTP ERROR:",
                    error
                );

                message.className =
                    "message error";

                message.innerText =
                    "OTP भेजने में समस्या हुई। कृपया फिर प्रयास करें।";

                button.innerText =
                    "📩 OTP फिर से भेजें";

                button.disabled = false;
            }
        );

    } catch (error) {

        console.error(
            "MSG91 OTP EXCEPTION:",
            error
        );

        message.className =
            "message error";

        message.innerText =
            "OTP Service में समस्या हुई। कृपया फिर प्रयास करें।";

        button.innerText =
            "📩 OTP फिर से भेजें";

        button.disabled = false;
    }
}

async function verifyOTP() {

    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();

    const otp =
        document
        .getElementById("otp")
        .value
        .trim();

    const button =
        document
        .getElementById("verifyOtpBtn");

    const message =
        document
        .getElementById("message");


    message.className = "";
    message.innerText = "";


    if (!/^\d{10}$/.test(mobile)) {

        message.className =
            "message error";

        message.innerText =
            "मोबाइल नंबर सही नहीं है।";

        return;

    }


    if (!/^\d{4,6}$/.test(otp)) {

        message.className =
            "message error";

        message.innerText =
            "कृपया सही OTP डालें।";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Verify हो रहा है...";


    try {

        window.verifyOtp(

            otp,

            async function(data) {

                console.log(
                    "MSG91 OTP Verified:",
                    data
                );


                let accessToken = "";

function findJwt(value) {

    if (
        typeof value === "string" &&
        value.split(".").length === 3
    ) {
        return value;
    }

    if (
        value &&
        typeof value === "object"
    ) {
        for (const key in value) {

            const found =
                findJwt(value[key]);

            if (found) {
                return found;
            }
        }
    }

    return null;
}

accessToken = findJwt(data);

console.log(
    "MSG91 Access Token:",
    accessToken
);
                
                if (!accessToken) {

                    message.className =
                        "message error";

                    message.innerText =
                        "OTP verify हुआ लेकिन access token नहीं मिला।";

                    button.disabled = false;

                    button.innerText =
                        "🔐 OTP Verify करके Login करें";

                    return;

                }


                const formData =
                    new FormData();

                formData.append(
                    "mobile",
                    mobile
                );

                formData.append(
                    "access_token",
                    accessToken
                );


                const response =
                    await fetch(
                        "/api/worker/verify-widget-token",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    message.className =
                        "message success";

                    message.innerText =
                        "Login सफल हुआ। Dashboard खोला जा रहा है...";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/worker/dashboard";

                        },
                        700
                    );


                } else {

                    message.className =
                        "message error";

                    message.innerText =
                        result.message ||
                        "Worker Login की अनुमति नहीं है।";

                    button.disabled = false;

                    button.innerText =
                        "🔐 OTP Verify करके Login करें";

                }

            },

            function(error) {

                console.error(
                    "OTP Verify Error:",
                    error
                );

                message.className =
                    "message error";

                message.innerText =
                    "OTP गलत है या expire हो गया है।";

                button.disabled = false;

                button.innerText =
                    "🔐 OTP Verify करके Login करें";

            },
            
            msg91ReqId

        );

    } catch (error) {

        console.error(
            "Verify Exception:",
            error
        );

        message.className =
            "message error";

        message.innerText =
            "OTP verification में समस्या हुई।";

        button.disabled = false;

        button.innerText =
            "🔐 OTP Verify करके Login करें";

    }

}

</script>

</body>

</html>
