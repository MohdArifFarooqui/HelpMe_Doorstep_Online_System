<!doctype html>
<html lang="hi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Worker OTP Login - HelpMe Doorstep</title>

<link rel="stylesheet" href="/static/style.css">

<style>

.login-card {
    max-width: 500px;
    margin: 40px auto;
    background: #fff;
    border: 1px solid #dce9e5;
    border-radius: 20px;
    padding: 30px;
    box-shadow: 0 5px 20px #123c2a12;
}

.login-card h1 {
    color: #164c3b;
    margin-bottom: 10px;
}

.login-card p {
    color: #555;
    margin-bottom: 25px;
}

.login-card label {
    display: block;
    font-weight: bold;
    margin-top: 15px;
    margin-bottom: 6px;
}

.login-card input {
    width: 100%;
    box-sizing: border-box;
    padding: 13px;
    border: 1px solid #ccdcd7;
    border-radius: 10px;
    font-size: 16px;
}

.login-card button {
    width: 100%;
    margin-top: 20px;
    padding: 14px;
    border: 0;
    border-radius: 10px;
    background: #16a085;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.login-card button:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.otp-box {
    display: none;
}

.message {
    margin-top: 15px;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    font-weight: bold;
}

.success {
    background: #e8f8f0;
    color: #18794e;
}

.error {
    background: #fdecec;
    color: #b42318;
}

.register-link,
.back-link {
    text-align: center;
    margin-top: 20px;
}

.register-link a {
    color: #16a085;
    font-weight: bold;
    text-decoration: none;
}

.back-link a {
    color: #555;
    text-decoration: none;
}

</style>

</head>

<body>

<header>

    <div class="brand">

        <div class="flat-logo">

            <img
                src="/static/WhatsApp%20Image%202026-09-13%20at%2012.32.28.jpeg"
                alt="HelpMe Doorstep"
            >

        </div>

    </div>

</header>

<main>

<div class="login-card">

<h1>👨‍🔧 Worker Login</h1>

<p>
Registered Mobile Number डालें और OTP से Login करें।
</p>


<div id="mobile-box">

<label>
मोबाइल नंबर
</label>

<input
    type="tel"
    id="mobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="10 अंकों का मोबाइल नंबर"
>

<div class="terms-box">

    <label class="terms-label">

        <input
            type="checkbox"
            id="termsAccepted"
        >

        <span>
            मैंने
            <a href="/terms" target="_blank">
                Terms & Conditions
            </a>
            और
            <a href="/privacy" target="_blank">
                Privacy Policy
            </a>
            पढ़ ली है और उन्हें स्वीकार करता/करती हूँ।
        </span>

    </label>

</div>
    
<button
    type="button"
    id="sendOtpBtn"
    onclick="sendOTP()"
>
📩 OTP भेजें
</button>

</div>


<div
    class="otp-box"
    id="otp-box"
>

<label>
4 अंकों का OTP
</label>

<input
    type="tel"
    id="otp"
    maxlength="4"
    inputmode="numeric"
    placeholder="4 Digit OTP"
>

<button
    type="button"
    id="verifyOtpBtn"
    onclick="verifyOTP()"
>
🔐 OTP Verify करके Login करें
</button>

</div>


<div id="message"></div>


<div class="register-link">

नए Service Provider हैं?

<br>

<a href="/worker/register">
👉 Registration करें
</a>

</div>


<div class="back-link">

<a href="/">
← Home पर वापस जाएँ
</a>

</div>

</div>

</main>


<!-- =========================
     MSG91 OTP WIDGET
========================= -->

<script type="text/javascript">

let widgetReady = false;
    
let msg91ReqId = null;

let widgetConfiguration = {

    widgetId: "36696a667454323039343333",

    tokenAuth: "567634T523KiwEkd6aa25285P1",

    exposeMethods: true,

    success: function(data) {

        console.log(
            "MSG91 Widget Success:",
            data
        );
        
        msg91ReqId =
        data && (
        data.message ||
        data.reqId ||
        data.reqID ||
        data["req-id"]
    );

console.log(
    "MSG91 reqId:",
    msg91ReqId
);

    },

    failure: function(error) {

        console.log(
            "MSG91 Widget Failure:",
            error
        );

    }

};

function loadMSG91Widget() {

    if (
        document.getElementById(
            "msg91-widget-script"
        )
    ) {
        return;
    }

    const script =
        document.createElement("script");

    script.id =
        "msg91-widget-script";

    script.type =
        "text/javascript";

    script.src =
        "https://verify.msg91.com/otp-provider.js";

    script.onload = function() {

        try {

            initSendOTP(
                widgetConfiguration
            );

            widgetReady = true;

        } catch (error) {

            console.error(
                "MSG91 Widget Init Error:",
                error
            );

        }

    };

    document.head.appendChild(script);

}

loadMSG91Widget();


async function sendOTP() {

    const mobile =
        document.getElementById("mobile").value.trim();
    
    const termsAccepted =
        document.getElementById("termsAccepted").checked;

    if (!termsAccepted) {

    message.className = "message error";

    message.innerText =
        "OTP भेजने से पहले Terms & Conditions और Privacy Policy स्वीकार करना जरूरी है।";

    return;
}

    const button =
        document.getElementById("sendOtpBtn");

    const message =
        document.getElementById("message");

    message.className = "";
    message.innerText = "";

    if (!/^\d{10}$/.test(mobile)) {

        message.className = "message error";

        message.innerText =
            "कृपया सही 10 अंकों का मोबाइल नंबर डालें।";

        return;
    }

    if (
        typeof window.sendOtp !== "function"
    ) {

        message.className = "message error";

        message.innerText =
            "OTP Service अभी तैयार नहीं है। कृपया कुछ सेकंड बाद फिर प्रयास करें।";

        return;
    }

    button.disabled = true;

    button.innerText =
        "OTP भेजा जा रहा है...";

    const identifier =
        "91" + mobile;

    try {

        window.sendOtp(
            identifier,

            function (data) {

                console.log(
                    "MSG91 OTP SUCCESS:",
                    data
                );

                document
                    .getElementById("otp-box")
                    .style.display = "block";

                message.className =
                    "message success";

                message.innerText =
                    "OTP आपके मोबाइल नंबर पर भेज दिया गया है।";

                document
                    .getElementById("otp")
                    .focus();

                button.innerText =
                    "📩 OTP फिर से भेजें";

                button.disabled = false;
            },

            function (error) {

                console.error(
                    "MSG91 OTP ERROR:",
                    error
                );

                message.className =
                    "message error";

                message.innerText =
                    "OTP भेजने में समस्या हुई। कृपया फिर प्रयास करें।";

                button.innerText =
                    "📩 OTP फिर से भेजें";

                button.disabled = false;
            }
        );

    } catch (error) {

        console.error(
            "MSG91 OTP EXCEPTION:",
            error
        );

        message.className =
            "message error";

        message.innerText =
            "OTP Service में समस्या हुई। कृपया फिर प्रयास करें।";

        button.innerText =
            "📩 OTP फिर से भेजें";

        button.disabled = false;
    }
}

async function verifyOTP() {

    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();

    const otp =
        document
        .getElementById("otp")
        .value
        .trim();

    const button =
        document
        .getElementById("verifyOtpBtn");

    const message =
        document
        .getElementById("message");


    message.className = "";
    message.innerText = "";


    if (!/^\d{10}$/.test(mobile)) {

        message.className =
            "message error";

        message.innerText =
            "मोबाइल नंबर सही नहीं है।";

        return;

    }


    if (!/^\d{4,6}$/.test(otp)) {

        message.className =
            "message error";

        message.innerText =
            "कृपया सही OTP डालें।";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Verify हो रहा है...";


    try {

        window.verifyOtp(

            otp,

            async function(data) {

                console.log(
                    "MSG91 OTP Verified:",
                    data
                );


                let accessToken = "";

function findJwt(value) {

    if (
        typeof value === "string" &&
        value.split(".").length === 3
    ) {
        return value;
    }

    if (
        value &&
        typeof value === "object"
    ) {
        for (const key in value) {

            const found =
                findJwt(value[key]);

            if (found) {
                return found;
            }
        }
    }

    return null;
}

accessToken = findJwt(data);

console.log(
    "MSG91 Access Token:",
    accessToken
);
                
                if (!accessToken) {

                    message.className =
                        "message error";

                    message.innerText =
                        "OTP verify हुआ लेकिन access token नहीं मिला।";

                    button.disabled = false;

                    button.innerText =
                        "🔐 OTP Verify करके Login करें";

                    return;

                }


                const formData =
                    new FormData();

                formData.append(
                    "mobile",
                    mobile
                );

                formData.append(
                    "access_token",
                    accessToken
                );


                const response =
                    await fetch(
                        "/api/worker/verify-widget-token",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    message.className =
                        "message success";

                    message.innerText =
                        "Login सफल हुआ। Dashboard खोला जा रहा है...";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/worker/dashboard";

                        },
                        700
                    );


                } else {

                    message.className =
                        "message error";

                    message.innerText =
                        result.message ||
                        "Worker Login की अनुमति नहीं है।";

                    button.disabled = false;

                    button.innerText =
                        "🔐 OTP Verify करके Login करें";

                }

            },

            function(error) {

                console.error(
                    "OTP Verify Error:",
                    error
                );

                message.className =
                    "message error";

                message.innerText =
                    "OTP गलत है या expire हो गया है।";

                button.disabled = false;

                button.innerText =
                    "🔐 OTP Verify करके Login करें";

            },
            
            msg91ReqId

        );

    } catch (error) {

        console.error(
            "Verify Exception:",
            error
        );

        message.className =
            "message error";

        message.innerText =
            "OTP verification में समस्या हुई।";

        button.disabled = false;

        button.innerText =
            "🔐 OTP Verify करके Login करें";

    }

}

</script>

</body>

</html>
