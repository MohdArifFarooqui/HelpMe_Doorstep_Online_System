<!doctype html>
<html lang="hi">
<head>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Worker OTP Login - HelpMe Doorstep</title>

<link rel="stylesheet" href="/static/style.css">

<style>
* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    font-family: Arial, "Noto Sans Devanagari", sans-serif;
}

body {
    min-height: 100vh;
    background: linear-gradient(135deg, #eefbf7, #eaf6ff, #f8fbff);
    color: #173f36;
}

/* ===== TOP BRAND / FLAT LOGO ===== */

header {
    width: 100%;
    background: rgba(255,255,255,0.97);
    border-bottom: 1px solid #d9ebe6;
    box-shadow: 0 3px 15px rgba(20,70,60,0.08);
    padding: 10px 12px 8px;
}

header .brand {
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

.flat-logo {
    width: min(430px, 94vw);
    height: 125px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
}

.flat-logo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
}

/* ===== MAIN AREA ===== */

main {
    min-height: calc(100vh - 160px);
    padding: 30px 14px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
}

/* ===== LOGIN CARD ===== */

.login-card {
    width: min(560px, 100%);
    margin: 0 auto;
    background: rgba(255,255,255,0.98);
    border: 1px solid #d8ebe5;
    border-radius: 28px;
    padding: 30px;
    box-shadow: 0 18px 50px rgba(24,79,67,0.13);
}

/* ===== WORKER HEADING ===== */

.login-card h1 {
    margin: 0 0 8px;
    color: #124c3e;
    font-size: 30px;
    line-height: 1.2;
}

.login-card p {
    color: #66746f;
    font-size: 16px;
    line-height: 1.55;
    margin: 8px 0 24px;
}

/* ===== LABEL ===== */

.login-card label {
    display: block;
    color: #164d41;
    font-weight: 700;
    font-size: 16px;
    margin: 0 0 8px;
}

/* ===== MOBILE INPUT ===== */

.login-card input[type="tel"] {
    width: 100%;
    height: 56px;
    padding: 0 16px;
    border: 1px solid #cbded8;
    border-radius: 14px;
    background: #fbfefd;
    color: #173e36;
    font-size: 17px;
    outline: none;
}

.login-card input[type="tel"]:focus {
    border-color: #18a77f;
    box-shadow: 0 0 0 4px rgba(24,167,127,0.10);
}

/* ===== TERMS ===== */

.terms-box {
    margin-top: 16px;
    padding: 14px 15px;
    border-radius: 15px;
    background: #eefaf6;
    border: 1px solid #d8eee7;
}

.terms-label {
    display: flex !important;
    align-items: flex-start;
    gap: 10px;
    margin: 0 !important;
    color: #52635f !important;
    font-weight: 400 !important;
    line-height: 1.55;
}

.terms-label input[type="checkbox"] {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    margin: 2px 0 0;
    accent-color: #159b77;
}

.terms-label span {
    font-size: 14px;
}

.terms-label a {
    color: #1768a3;
    font-weight: 700;
    text-decoration: underline;
}

/* ===== BUTTON ===== */

.login-card button {
    width: 100%;
    min-height: 56px;
    margin-top: 17px;
    padding: 13px 16px;
    border: 0;
    border-radius: 14px;
    background: linear-gradient(135deg, #18b486, #119b76);
    color: #fff;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(17,155,118,0.20);
}

.login-card button:hover {
    transform: translateY(-1px);
}

.login-card button:disabled {
    opacity: 0.62;
    cursor: not-allowed;
    box-shadow: none;
}

/* ===== OTP ===== */

.otp-box {
    display: none;
    margin-top: 22px;
    padding-top: 20px;
    border-top: 1px dashed #cfe1dc;
}

/* ===== MESSAGE ===== */

.message {
    margin-top: 15px;
    padding: 12px 14px;
    border-radius: 12px;
    text-align: center;
    font-weight: 700;
    font-size: 14px;
    line-height: 1.45;
}

.message:empty {
    display: none;
}

.success {
    background: #eaf9f2;
    color: #16764f;
    border: 1px solid #c8eadc;
}

.error {
    background: #fff0f0;
    color: #b42318;
    border: 1px solid #f1cccc;
}

/* ===== REGISTRATION / BACK ===== */

.register-link,
.back-link {
    text-align: center;
    margin-top: 20px;
    line-height: 1.7;
}

.register-link {
    color: #536761;
}

.register-link a {
    color: #159b77;
    font-weight: 700;
    text-decoration: none;
}

.back-link a {
    color: #586b66;
    font-weight: 600;
    text-decoration: none;
}

/* ===== MOBILE ===== */

@media (max-width: 600px) {

    header {
        padding: 8px 8px 6px;
    }

    .flat-logo {
        width: 96vw;
        height: 105px;
    }

    main {
        min-height: calc(100vh - 125px);
        padding: 18px 10px;
    }

    .login-card {
        border-radius: 23px;
        padding: 22px 18px;
    }

    .login-card h1 {
        font-size: 27px;
    }

    .login-card p {
        font-size: 15px;
        margin-bottom: 20px;
    }

    .login-card input[type="tel"] {
        height: 54px;
        font-size: 16px;
    }

    .login-card button {
        min-height: 54px;
        font-size: 16px;
    }

    .terms-box {
        padding: 13px;
    }

    .terms-label span {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<header>

    <div class="brand">

        <div class="flat-logo">

            <img
                src="/static/WhatsApp%20Image%202026-09-13%20at%2012.32.28.jpeg"
                alt="HelpMe Doorstep"
            >

        </div>

    </div>

</header>

<main>

<div class="login-card">

<h1>👨‍🔧 Worker Login</h1>

<p>
Registered Mobile Number डालें और OTP से Login करें।
</p>


<div id="mobile-box">

<label>
मोबाइल नंबर
</label>

<input
    type="tel"
    id="mobile"
    maxlength="10"
    inputmode="numeric"
    placeholder="10 अंकों का मोबाइल नंबर"
>

<div class="terms-box">

    <label class="terms-label">

        <input
            type="checkbox"
            id="termsAccepted"
        >

        <span>
            मैंने
            <a href="/terms" target="_blank">
                Terms & Conditions
            </a>
            और
            <a href="/privacy" target="_blank">
                Privacy Policy
            </a>
            पढ़ ली है और उन्हें स्वीकार करता/करती हूँ।
        </span>

    </label>

</div>
    
<button
    type="button"
    id="sendOtpBtn"
    onclick="sendOTP()"
>
📩 OTP भेजें
</button>

</div>


<div
    class="otp-box"
    id="otp-box"
>

<label>
4 अंकों का OTP
</label>

<input
    type="tel"
    id="otp"
    maxlength="4"
    inputmode="numeric"
    placeholder="4 Digit OTP"
>

<button
    type="button"
    id="verifyOtpBtn"
    onclick="verifyOTP()"
>
🔐 OTP Verify करके Login करें
</button>

</div>


<div id="message"></div>


<div class="register-link">

नए Service Provider हैं?

<br>

<a href="/worker/register">
👉 Registration करें
</a>

</div>


<div class="back-link">

<a href="/">
← Home पर वापस जाएँ
</a>

</div>

</div>

</main>


<!-- =========================
     MSG91 OTP WIDGET
========================= -->

<script type="text/javascript">

let widgetReady = false;
    
let msg91ReqId = null;

let widgetConfiguration = {

    widgetId: "36696a667454323039343333",

    tokenAuth: "567634T523KiwEkd6aa25285P1",

    exposeMethods: true,

    success: function(data) {

        console.log(
            "MSG91 Widget Success:",
            data
        );
        
        msg91ReqId =
        data && (
        data.message ||
        data.reqId ||
        data.reqID ||
        data["req-id"]
    );

console.log(
    "MSG91 reqId:",
    msg91ReqId
);

    },

    failure: function(error) {

        console.log(
            "MSG91 Widget Failure:",
            error
        );

    }

};

function loadMSG91Widget() {

    if (
        document.getElementById(
            "msg91-widget-script"
        )
    ) {
        return;
    }

    const script =
        document.createElement("script");

    script.id =
        "msg91-widget-script";

    script.type =
        "text/javascript";

    script.src =
        "https://verify.msg91.com/otp-provider.js";

    script.onload = function() {

        try {

            initSendOTP(
                widgetConfiguration
            );

            widgetReady = true;

        } catch (error) {

            console.error(
                "MSG91 Widget Init Error:",
                error
            );

        }

    };

    document.head.appendChild(script);

}

loadMSG91Widget();


async function sendOTP() {

    const mobile =
        document.getElementById("mobile").value.trim();
    
    const termsAccepted =
        document.getElementById("termsAccepted").checked;

    if (!termsAccepted) {

    message.className = "message error";

    message.innerText =
        "OTP भेजने से पहले Terms & Conditions और Privacy Policy स्वीकार करना जरूरी है।";

    return;
}

    const button =
        document.getElementById("sendOtpBtn");

    const message =
        document.getElementById("message");

    message.className = "";
    message.innerText = "";

    if (!/^\d{10}$/.test(mobile)) {

        message.className = "message error";

        message.innerText =
            "कृपया सही 10 अंकों का मोबाइल नंबर डालें।";

        return;
    }

    if (
        typeof window.sendOtp !== "function"
    ) {

        message.className = "message error";

        message.innerText =
            "OTP Service अभी तैयार नहीं है। कृपया कुछ सेकंड बाद फिर प्रयास करें।";

        return;
    }

    button.disabled = true;

    button.innerText =
        "OTP भेजा जा रहा है...";

    const identifier =
        "91" + mobile;

    try {

        window.sendOtp(
            identifier,

            function (data) {

                console.log(
                    "MSG91 OTP SUCCESS:",
                    data
                );

                document
                    .getElementById("otp-box")
                    .style.display = "block";

                message.className =
                    "message success";

                message.innerText =
                    "OTP आपके मोबाइल नंबर पर भेज दिया गया है।";

                document
                    .getElementById("otp")
                    .focus();

                button.innerText =
                    "📩 OTP फिर से भेजें";

                button.disabled = false;
            },

            function (error) {

                console.error(
                    "MSG91 OTP ERROR:",
                    error
                );

                message.className =
                    "message error";

                message.innerText =
                    "OTP भेजने में समस्या हुई। कृपया फिर प्रयास करें।";

                button.innerText =
                    "📩 OTP फिर से भेजें";

                button.disabled = false;
            }
        );

    } catch (error) {

        console.error(
            "MSG91 OTP EXCEPTION:",
            error
        );

        message.className =
            "message error";

        message.innerText =
            "OTP Service में समस्या हुई। कृपया फिर प्रयास करें।";

        button.innerText =
            "📩 OTP फिर से भेजें";

        button.disabled = false;
    }
}

async function verifyOTP() {

    const mobile =
        document
        .getElementById("mobile")
        .value
        .trim();

    const otp =
        document
        .getElementById("otp")
        .value
        .trim();

    const button =
        document
        .getElementById("verifyOtpBtn");

    const message =
        document
        .getElementById("message");


    message.className = "";
    message.innerText = "";


    if (!/^\d{10}$/.test(mobile)) {

        message.className =
            "message error";

        message.innerText =
            "मोबाइल नंबर सही नहीं है।";

        return;

    }


    if (!/^\d{4,6}$/.test(otp)) {

        message.className =
            "message error";

        message.innerText =
            "कृपया सही OTP डालें।";

        return;

    }


    button.disabled = true;

    button.innerText =
        "Verify हो रहा है...";


    try {

        window.verifyOtp(

            otp,

            async function(data) {

                console.log(
                    "MSG91 OTP Verified:",
                    data
                );


                let accessToken = "";

function findJwt(value) {

    if (
        typeof value === "string" &&
        value.split(".").length === 3
    ) {
        return value;
    }

    if (
        value &&
        typeof value === "object"
    ) {
        for (const key in value) {

            const found =
                findJwt(value[key]);

            if (found) {
                return found;
            }
        }
    }

    return null;
}

accessToken = findJwt(data);

console.log(
    "MSG91 Access Token:",
    accessToken
);
                
                if (!accessToken) {

                    message.className =
                        "message error";

                    message.innerText =
                        "OTP verify हुआ लेकिन access token नहीं मिला।";

                    button.disabled = false;

                    button.innerText =
                        "🔐 OTP Verify करके Login करें";

                    return;

                }


                const formData =
                    new FormData();

                formData.append(
                    "mobile",
                    mobile
                );

                formData.append(
                    "access_token",
                    accessToken
                );


                const response =
                    await fetch(
                        "/api/worker/verify-widget-token",
                        {
                            method: "POST",
                            body: formData
                        }
                    );


                const result =
                    await response.json();


                if (result.success) {

                    message.className =
                        "message success";

                    message.innerText =
                        "Login सफल हुआ। Dashboard खोला जा रहा है...";


                    setTimeout(
                        function() {

                            window.location.href =
                                "/worker/dashboard";

                        },
                        700
                    );


                } else {

                    message.className =
                        "message error";

                    message.innerText =
                        result.message ||
                        "Worker Login की अनुमति नहीं है।";

                    button.disabled = false;

                    button.innerText =
                        "🔐 OTP Verify करके Login करें";

                }

            },

            function(error) {

                console.error(
                    "OTP Verify Error:",
                    error
                );

                message.className =
                    "message error";

                message.innerText =
                    "OTP गलत है या expire हो गया है।";

                button.disabled = false;

                button.innerText =
                    "🔐 OTP Verify करके Login करें";

            },
            
            msg91ReqId

        );

    } catch (error) {

        console.error(
            "Verify Exception:",
            error
        );

        message.className =
            "message error";

        message.innerText =
            "OTP verification में समस्या हुई।";

        button.disabled = false;

        button.innerText =
            "🔐 OTP Verify करके Login करें";

    }

}

</script>

</body>

</html>
