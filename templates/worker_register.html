<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worker Registration - HelpMe Doorstep</title>
<link rel="stylesheet" href="/static/style.css">
</head>

<body>

<header>
<div class="brand">
<div class="logo">🤝</div>
<div>
<b>HelpMe Doorstep</b>
<small>Service Provider Registration</small>
</div>
</div>

<a href="/">Home</a>
</header>

<main>

<section class="hero">
<h1>👤 Service Provider Registration</h1>
<p>सेवा प्रदान करने के लिए अपना Registration करें।</p>
</section>

<form class="card" method="post" action="/worker/register">

{% for cat,msg in get_flashed_messages(with_categories=true) %}
<div class="alert {{cat}}">{{msg}}</div>
{% endfor %}

<label>
नाम
<input
name="name"
type="text"
maxlength="120"
placeholder="अपना पूरा नाम"
required>
</label>

<label>
मोबाइल नंबर
<input
name="mobile"
type="tel"
inputmode="numeric"
pattern="[0-9]{10}"
maxlength="10"
placeholder="10 अंकों का मोबाइल नंबर"
required>
</label>

<label>
पासवर्ड
<input
name="password"
type="password"
minlength="6"
placeholder="कम से कम 6 अक्षर"
required>
</label>

<label>
CSC ID
<span style="color:#71847e;">(यदि उपलब्ध हो)</span>
<input
name="csc_id"
type="text"
maxlength="50"
placeholder="CSC ID">
</label>

<label>
Center / Organization का नाम
<input
name="center_name"
type="text"
maxlength="150"
placeholder="Center या संस्था का नाम">
</label>

<!-- STATE -->
<label>
राज्य (State)

<select name="state" id="state" required>
<option value="">-- राज्य चुनें --</option>

<option value="Andhra Pradesh">Andhra Pradesh</option>
<option value="Arunachal Pradesh">Arunachal Pradesh</option>
<option value="Assam">Assam</option>
<option value="Bihar">Bihar</option>
<option value="Chhattisgarh">Chhattisgarh</option>
<option value="Goa">Goa</option>
<option value="Gujarat">Gujarat</option>
<option value="Haryana">Haryana</option>
<option value="Himachal Pradesh">Himachal Pradesh</option>
<option value="Jharkhand">Jharkhand</option>
<option value="Karnataka">Karnataka</option>
<option value="Kerala">Kerala</option>
<option value="Madhya Pradesh">Madhya Pradesh</option>
<option value="Maharashtra">Maharashtra</option>
<option value="Manipur">Manipur</option>
<option value="Meghalaya">Meghalaya</option>
<option value="Mizoram">Mizoram</option>
<option value="Nagaland">Nagaland</option>
<option value="Odisha">Odisha</option>
<option value="Punjab">Punjab</option>
<option value="Rajasthan">Rajasthan</option>
<option value="Sikkim">Sikkim</option>
<option value="Tamil Nadu">Tamil Nadu</option>
<option value="Telangana">Telangana</option>
<option value="Tripura">Tripura</option>
<option value="Uttar Pradesh">Uttar Pradesh</option>
<option value="Uttarakhand">Uttarakhand</option>
<option value="West Bengal">West Bengal</option>

<option value="Andaman and Nicobar Islands">
Andaman and Nicobar Islands
</option>

<option value="Chandigarh">Chandigarh</option>

<option value="Dadra and Nagar Haveli and Daman and Diu">
Dadra and Nagar Haveli and Daman and Diu
</option>

<option value="Delhi">Delhi</option>
<option value="Jammu and Kashmir">Jammu and Kashmir</option>
<option value="Ladakh">Ladakh</option>
<option value="Lakshadweep">Lakshadweep</option>
<option value="Puducherry">Puducherry</option>

</select>
</label>


<!-- DISTRICT -->
<label>
जिला (District)

<select name="district" id="district" required>
<option value="">-- पहले राज्य चुनें --</option>
</select>

</label>

<!-- GPS LOCATION -->

<label>
📍 आपकी वर्तमान Location
</label>

<input
type="hidden"
name="latitude"
id="latitude">

<input
type="hidden"
name="longitude"
id="longitude">

<button
type="button"
id="locationBtn"
onclick="getLocation()"
style="background:#1976d2;margin-bottom:10px;">

📍 मेरी Location लें

</button>

<div
id="locationStatus"
style="
padding:10px;
margin-bottom:15px;
border-radius:8px;
background:#f1f5f4;
font-size:14px;
">

Location अभी प्राप्त नहीं हुई है।

</div>

<label>
पता
<textarea
name="address"
placeholder="पूरा पता"
required></textarea>
</label>


<button type="submit">
Registration करें
</button>


<p style="text-align:center;margin-top:18px;">
पहले से Registration है?
<a href="/worker/login">Worker Login</a>
</p>

</form>

</main>

<script src="/static/india-data.js"></script>
    
<script>

const districts = {

"Uttar Pradesh": [

"Agra",
"Aligarh",
"Prayagraj",
"Ambedkar Nagar",
"Amethi",
"Amroha",
"Auraiya",
"Azamgarh",
"Baghpat",
"Bahraich",
"Ballia",
"Balrampur",
"Banda",
"Barabanki",
"Bareilly",
"Basti",
"Bijnor",
"Badaun",
"Bulandshahar",
"Chandauli",
"Chitrakoot",
"Deoria",
"Etah",
"Etawah",
"Ayodhya",
"Farrukhabad",
"Fatehpur",
"Firozabad",
"Gautam Buddha Nagar",
"Ghaziabad",
"Ghazipur",
"Gonda",
"Gorakhpur",
"Hamirpur",
"Hapur",
"Hardoi",
"Hathras",
"Jalaun",
"Jaunpur",
"Jhansi",
"Kannauj",
"Kanpur Dehat",
"Kanpur Nagar",
"Kasganj",
"Kaushambi",
"Kushi Nagar (Padrauna)",
"Lakhimpur Kheri",
"Lalitpur",
"Lucknow",
"Maharajganj",
"Mahoba",
"Mainpuri",
"Mathura",
"Mau",
"Meerut",
"Mirzapur",
"Moradabad",
"Muzaffar Nagar",
"Pilibhit",
"Pratapgarh",
"Raebareli",
"Rampur",
"Saharanpur",
"Sambhal",
"Sant Kabir Nagar",
"Sant Ravidas Nagar",
"Shahjahanpur",
"Shamali",
"Shravasti",
"Siddharth Nagar",
"Sitapur",
"Sonbhadra",
"Sultanpur",
"Unnao",
"Varanasi"

]

};


const stateSelect = document.getElementById("state");
const districtSelect = document.getElementById("district");


stateSelect.addEventListener("change", function() {

    const selectedState = this.value;

    districtSelect.innerHTML =
        '<option value="">-- जिला चुनें --</option>';

    if (districts[selectedState]) {

        districts[selectedState].forEach(function(district) {

            const option = document.createElement("option");

            option.value = district;
            option.textContent = district;

            districtSelect.appendChild(option);

        });

    }

});

    function getLocation() {

    const status = document.getElementById("locationStatus");
    const button = document.getElementById("locationBtn");

    if (!navigator.geolocation) {

        status.textContent =
            "इस device/browser में Location सुविधा उपलब्ध नहीं है।";

        return;
    }

    button.disabled = true;
    button.textContent = "📍 Location प्राप्त हो रही है...";

    status.textContent =
        "कृपया Location Permission को Allow करें...";

    navigator.geolocation.getCurrentPosition(

        function(position) {

            const latitude = position.coords.latitude;
            const longitude = position.coords.longitude;

            document.getElementById("latitude").value =
                latitude;

            document.getElementById("longitude").value =
                longitude;

            status.textContent =
                "✅ Location सफलतापूर्वक प्राप्त हो गई।";

            button.textContent =
                "✅ Location मिल गई";

            button.style.background =
                "#168f68";

        },

        function(error) {

            button.disabled = false;
            button.textContent =
                "📍 मेरी Location लें";

            if (error.code === 1) {

                status.textContent =
                    "❌ Location Permission Denied है। कृपया Browser Settings में Location Allow करें।";

            } else if (error.code === 2) {

                status.textContent =
                    "❌ Location उपलब्ध नहीं है। GPS/Location चालू करके दोबारा प्रयास करें।";

            } else if (error.code === 3) {

                status.textContent =
                    "❌ Location प्राप्त करने में समय लग गया। दोबारा प्रयास करें।";

            } else {

                status.textContent =
                    "❌ Location प्राप्त नहीं हो सकी। दोबारा प्रयास करें।";
            }

        },

        {
            enableHighAccuracy: true,
            timeout: 15000,
            maximumAge: 0
        }

    );
}
</script>

</body>
</html>
