<!doctype html>
<html lang="hi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">

    <title>Complaint - HelpMe Doorstep</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f8f6;
            color: #173c33;
        }

        header {
            background: #ffffff;
            padding: 16px 5%;
            border-bottom: 1px solid #dce9e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            background: #168b62;
            color: #ffffff;
            border-radius: 12px;
            padding: 10px 12px;
            font-size: 22px;
        }

        .brand b {
            display: block;
            font-size: 20px;
        }

        .brand small {
            color: #71847e;
        }

        header a {
            text-decoration: none;
            font-weight: bold;
            color: #0870b9;
        }

        main {
            width: 100%;
            max-width: 650px;
            margin: 35px auto;
            padding: 0 18px;
        }

        .card {
            background: #ffffff;
            border: 1px solid #dce9e5;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 7px 22px #123c2a12;
        }

        h1 {
            margin-top: 0;
            color: #168b62;
        }

        .note {
            color: #5d706a;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px;
            margin-top: 7px;
            border: 1px solid #cbdcd6;
            border-radius: 10px;
            font-size: 16px;
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #168b62;
            color: #ffffff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.92;
        }

        .back {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            color: #0870b9;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            header {
                padding: 14px;
            }

            .brand b {
                font-size: 17px;
            }

            .card {
                padding: 20px;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="brand">
        <div class="logo">🤝</div>

        <div>
            <b>HelpMe Doorstep</b>
            <small>आपकी सेवा, आपके द्वार</small>
        </div>
    </div>

    <a href="/">🏠 Home</a>
</header>

<main>

    <section class="card">

        <h1>📝 Complaint दर्ज करें</h1>

        <p class="note">
            यदि आपकी service से संबंधित कोई समस्या है, तो नीचे
            Application ID, Mobile Number और Complaint Details भरकर
            शिकायत दर्ज करें।
        </p>

        <form method="post" action="/complaint">

            <input
                type="hidden"
                name="csrf_token"
                value="{{ csrf_token() }}"
            >

            <label for="application_code">
                Application ID
            </label>

            <input
                id="application_code"
                name="application_code"
                type="text"
                placeholder="जैसे HMD-2026-0001"
                required
            >

            <label for="phone">
                Mobile Number
            </label>

            <input
                id="phone"
                name="phone"
                type="tel"
                inputmode="numeric"
                maxlength="10"
                pattern="[0-9]{10}"
                placeholder="10 अंकों का Mobile Number"
                required
            >

            <label for="category">
                Complaint Category
            </label>

            <select
                id="category"
                name="category"
                required
            >
                <option value="">Complaint Category चुनें</option>
                <option value="Service Delay">Service Delay</option>
                <option value="Worker Related">Worker Related</option>
                <option value="Payment Related">Payment Related</option>
                <option value="Application Related">Application Related</option>
                <option value="Technical Issue">Technical Issue</option>
                <option value="Other">Other</option>
            </select>

            <label for="details">
                Complaint Details
            </label>

            <textarea
                id="details"
                name="details"
                placeholder="अपनी समस्या विस्तार से लिखें..."
                required
            ></textarea>

            <button type="submit">
                🚨 Complaint Submit करें
            </button>

        </form>

        <a class="back" href="/">
            ← वापस Home पर जाएँ
        </a>

    </section>

</main>

</body>
</html>
