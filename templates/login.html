<!doctype html>
<html lang="hi">

<head>
    <meta charset="utf-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <title>Admin Login</title>

    <link rel="stylesheet"
          href="/static/style.css">
</head>

<body>

<main class="center">

    <form class="card"
          method="post"
          action="/admin/login">

        <h2>Admin Login</h2>


        {% for cat,msg in get_flashed_messages(with_categories=true) %}

        <div class="alert {{cat}}">
            {{msg}}
        </div>

        {% endfor %}


        <label>
            Username

            <input
                name="username"
                required
            >
        </label>


        <label>
            Password

            <input
                type="password"
                name="password"
                required
            >
        </label>


        <!-- TERMS & PRIVACY ACCEPTANCE -->

        <div style="
            margin:18px 0;
            padding:14px;
            background:#f5f7f8;
            border-radius:10px;
        ">

            <label style="
                display:flex;
                align-items:flex-start;
                gap:10px;
                cursor:pointer;
                font-weight:normal;
            ">

                <input
                    type="checkbox"
                    name="terms_accepted"
                    value="yes"
                    required
                    style="
                        width:20px;
                        height:20px;
                        margin-top:3px;
                    "
                >

                <span>

                    मैंने

                    <a
                        href="/terms"
                        target="_blank"
                        rel="noopener"
                    >
                        Terms & Conditions
                    </a>

                    और

                    <a
                        href="/privacy"
                        target="_blank"
                        rel="noopener"
                    >
                        Privacy Policy
                    </a>

                    पढ़ ली है और उन्हें
                    स्वीकार करता/करती हूँ।

                </span>

            </label>

        </div>


        <button type="submit">
            Login
        </button>

    </form>

</main>

</body>

</html>
